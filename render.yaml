services:
  - type: web
    name: TankWaves
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tankwaves-db
          property: connectionString

databases:
  - name: tankwaves-db
    plan: free
