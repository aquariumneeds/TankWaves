<form class="search-form v7-search-form" method="get" action="{{ url_for('browse') }}">
  <input name="q" value="{{ q or '' }}" placeholder="Search fish, coral, plants, equipment...">
  <select name="category">
    <option value="">All categories</option>
    {% for item in categories %}
      <option value="{{ item }}" {% if category == item %}selected{% endif %}>{{ item }}</option>
    {% endfor %}
  </select>
  <input name="seller" value="{{ seller or '' }}" placeholder="Seller or store">
  <input name="state" value="{{ state or '' }}" placeholder="State">
  <input type="number" step="0.01" min="0" name="price_min" value="{{ price_min or '' }}" placeholder="Min price">
  <input type="number" step="0.01" min="0" name="price_max" value="{{ price_max or '' }}" placeholder="Max price">
  <select name="shipping">
    <option value="">Any delivery</option>
    <option value="shipping" {% if shipping == 'shipping' %}selected{% endif %}>Shipping available</option>
    <option value="pickup" {% if shipping == 'pickup' %}selected{% endif %}>Local pickup</option>
  </select>
  <select name="sort">
    <option value="newest" {% if sort == 'newest' %}selected{% endif %}>Best match / newest</option>
    <option value="price_low" {% if sort == 'price_low' %}selected{% endif %}>Lowest price</option>
    <option value="price_high" {% if sort == 'price_high' %}selected{% endif %}>Highest price</option>
  </select>
  <button class="button" type="submit">Search all sellers</button>
</form>
