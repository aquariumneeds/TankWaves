{% extends 'base.html' %}{% block content %}<h1>Create listing</h1><form method="post" enctype="multipart/form-data" class="panel form"><input name="title" placeholder="Listing title" required><select name="category">{% for c in cats %}<option>{{c}}</option>{% endfor %}</select><input name="species" placeholder="Species" required><input type="number" step=".01" name="price" placeholder="Price" required><input type="number" name="quantity" value="1" required><input name="city" value="{{current_user.city}}" required><input name="state" value="{{current_user.state}}" required><input type="file" name="photos" multiple><textarea name="description" rows="7" placeholder="Description" required></textarea><label><input type="checkbox" name="shipping"> Shipping available</label><label><input type="checkbox" name="pickup" checked> Local pickup</label><button class="button">Publish</button></form>{% endblock %}
