{% extends "base.html" %}{% block content %}<div class="detail"><section><img class="heroimg" src="{{ listing.image_url or 'https://placehold.co/1000x650?text=AquaMarket' }}"><div class="panel"><small>{{listing.category}} · {{listing.location}}</small><h1>{{listing.title}}</h1><p>{{listing.species}}</p><h2>${{"%.2f"|format(listing.price)}}</h2><p>{{listing.description}}</p><p><b>Quantity:</b> {{listing.quantity}} · <b>Shipping:</b> {{listing.shipping}}</p></div></section><aside class="panel"><h2>Contact seller</h2><form method="post" class="stack"><input name="buyer_name" placeholder="Your name" required><input type="email" name="buyer_email" placeholder="Your email" required><textarea name="message" rows="6" required>I'm interested in {{listing.title}}. Is it available?</textarea><button class="button">Send inquiry</button></form></aside></div>{% endblock %}
