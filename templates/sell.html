{% extends "base.html" %}{% block content %}<h1>Create a listing</h1><form method="post" class="panel form"><input name="title" placeholder="Listing title" required><input name="species" placeholder="Species" required><select name="category">{% for x in ["Freshwater Fish","Saltwater Fish","Shrimp","Snails","Plants","Coral","Invertebrates","Equipment"] %}<option>{{x}}</option>{% endfor %}</select><input type="number" step=".01" name="price" placeholder="Price" required><input type="number" name="quantity" value="1" required><input name="location" placeholder="Raleigh, NC" required><select name="shipping"><option>Local pickup</option><option>Overnight available</option><option>Nationwide shipping</option></select><input name="image_url" placeholder="Image URL (optional)"><textarea name="description" rows="7" placeholder="Description" required></textarea><input name="seller_name" placeholder="Seller name" required><input type="email" name="seller_email" placeholder="Seller email" required><button class="button">Publish listing</button></form>{% endblock %}
