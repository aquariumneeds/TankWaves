<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AquaMarket{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><div class="container nav"><a class="brand" href="{{ url_for('home') }}">AquaMarket</a><nav><a href="{{ url_for('home') }}">Browse</a><a class="button" href="{{ url_for('sell') }}">Sell</a></nav></div></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer><div class="container">Aquarium livestock marketplace MVP</div></footer></body></html>
